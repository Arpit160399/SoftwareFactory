[package]
name = "softwarefactory"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Project-scoped product workflow coordinator and terminal setup wizard"
license = "MIT"
repository = "https://github.com/Arpit160399/SoftwareFactory"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
semver = "1"

tempfile = "3"
